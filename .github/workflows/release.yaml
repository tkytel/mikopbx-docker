name: Release Package

on:
  workflow_dispatch:
    inputs:
      php_version:
        type: string
        required: true
        description: PHP version (must be packaged by the Debian release)
        default: "8.4"
      debian_codename:
        type: string
        required: true
        description: Debian codename
        default: "trixie"
      phalcon_version:
        type: string
        required: true
        description: cphalcon version
        default: "5.9.3"
      asterisk_version:
        type: string
        required: true
        description: Asterisk version
        default: "22.8.2"
      miko_pbx_version:
        type: string
        required: true
        description: MikoPBX version (tag, branch or commit of mikopbx/Core)
        default: "2026.3.40"

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            matrix.qemu: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            matrix.qemu: false
          # FIXME: https://github.com/mikopbx/Core/issues/889
          # - platform: linux/arm/v7
          #   runner: ubuntu-24.04-arm
          #   matrix.qemu: true
          # - platform: linux/arm/v6
          #   runner: ubuntu-24.04-arm
          #   matrix.qemu: true
          # - platform: linux/386
          #   runner: ubuntu-latest
          #   matrix.qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set platform pair name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ github.event.inputs.miko_pbx_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ matrix.qemu }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ github.event.inputs.php_version }}
            DEBIAN_CODENAME=${{ github.event.inputs.debian_codename }}
            PHALCON_VERSION=${{ github.event.inputs.phalcon_version }}
            ASTERISK_VERSION=${{ github.event.inputs.asterisk_version }}
            MIKOPBX_VERSION=${{ github.event.inputs.miko_pbx_version }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ env.PLATFORM_PAIR }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ github.event.inputs.miko_pbx_version }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@%s ' $(cat *.digest))

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
